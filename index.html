<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .local {
    position: absolute;
    top: max(32px, env(safe-area-inset-top));
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #000;
  }

  .local svg { width: 20px; height: 20px; fill: #e53935; flex-shrink: 0; }

  .foto {
    display: block;
    width: 220px;
    height: 220px;
    margin: 0 auto;
    object-fit: cover;
    object-position: 50% 30%;
    border-radius: 50%;
    background: #f1f1f1;
    box-shadow: 0 0 0 4px #fff, 0 0 0 6px #25d366;
  }

  .nome {
    margin-top: 24px;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 24px;
    width: 100%;
    padding: 18px 20px;
    background: #25d366;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
    border: 0;
    cursor: pointer;
    transition: background .15s ease;
  }

  .btn:hover { background: #1fb957; }
  .btn:focus-visible { outline: 3px solid #1a1a1a; outline-offset: 3px; }

  .btn svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; }
</style>
